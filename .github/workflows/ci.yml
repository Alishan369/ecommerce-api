name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Security advisories
        run: composer audit --no-interaction

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t saanjh-api .

      - name: Refuses to start without production settings
        run: |
          if docker run --rm saanjh-api; then
            echo "The container started without APP_KEY / database / FRONTEND_URL." && exit 1
          fi

      - name: Boots on SQLite with a disk (Render setup) and is healthy
        run: |
          # The named volume stands in for Render's persistent disk.
          docker run -d --name api -p 10000:10000 -v api-data:/var/www/html/storage/app \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e FRONTEND_URL=https://shop.test \
            -e ADMIN_EMAIL=admin@shop.test -e ADMIN_PASSWORD=ci-admin-password -e RUN_SCHEDULER=true \
            saanjh-api
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:10000/up && break; sleep 2; done
          curl -fsS http://127.0.0.1:10000/api/v1/health
          curl -fsS -o /dev/null http://127.0.0.1:10000/api/v1/products
          # The healthcheck docker-compose.prod.yml runs inside the container.
          docker exec api curl -fsS -o /dev/null http://127.0.0.1:10000/up
          # The scheduler runs next to Apache ([:] keeps grep from matching its own command line).
          docker exec api sh -c 'grep -l "schedule[:]work" /proc/[0-9]*/cmdline'
          # A restart keeps the database and only migrates.
          docker restart api
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:10000/up && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:10000/api/v1/products
          docker logs api 2>&1 | grep -c "Admin ready" | grep -qx 1

      - name: Container logs
        if: failure()
        run: docker logs api || true
