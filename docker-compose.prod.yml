# Production stack for one server: Caddy (HTTPS) → the API, a queue worker, the scheduler and MySQL.
#
#   cp .env.production.example .env.production        # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec app php artisan db:seed --force
#                                                       # ↑ first deploy only: admin account + catalogue
#
# --env-file supplies the ${...} values in this file; env_file passes the same file into the containers.

name: saanjh

x-app: &app
  build: .
  image: saanjh-api:latest
  env_file: .env.production
  restart: unless-stopped

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Migrates on start (docker/start.sh), then serves the API. Not published: only Caddy reaches it,
  # which is what makes TRUSTED_PROXIES=* safe.
  app:
    <<: *app
    environment:
      CONTAINER_ROLE: web
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:10000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Order and password-reset emails are queued — without this they are never sent.
  worker:
    <<: *app
    user: www-data
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy

  # Cancels unpaid online orders (releasing their stock) and prunes carts and expired tokens.
  scheduler:
    <<: *app
    user: www-data
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: the image's first-boot setup server only listens on the socket.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# Back these up: mysql-data (or a nightly mysqldump) and uploads (product and category images).
volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
