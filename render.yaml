# Render Blueprint — the API as one always-on container (Dashboard → New → Blueprint → this repo).
# The SQLite database (storage/app/database.sqlite) and uploaded images (storage/app/public) live on
# a persistent disk, so they survive restarts and redeploys. Render snapshots the disk daily.
# A disk needs a paid instance; the free plan has none and would lose everything on every restart.
services:
  - type: web
    name: saanjh-api
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /up
    disk:
      name: data
      mountPath: /var/www/html/storage/app
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Saanjh
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Render asks for these when the Blueprint is applied.
      # APP_KEY: run `php artisan key:generate --show` locally and paste the output.
      - key: APP_KEY
        sync: false
      # The storefront, e.g. https://ecommerce-frontend.vercel.app (CORS and links in emails).
      - key: FRONTEND_URL
        sync: false
      # The admin login, created on the first start. Password: 12+ characters, not the README default.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      # One container, so no separate worker: emails are sent during the request,
      # and the scheduler (expire unpaid orders, prune carts and tokens) runs alongside Apache.
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_SCHEDULER
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Render's load balancer terminates HTTPS.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: FORCE_HTTPS
        value: "true"
      # Tighten to your Vercel URL once it exists, e.g. https://ecommerce-frontend.vercel.app
      # ("*" is safe here: the API uses Bearer tokens, not cookies).
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
