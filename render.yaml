# Render Blueprint — free public demo of the API (Dashboard → New → Blueprint → this repo).
# The SQLite database lives in the container, so the store resets to the seeded demo data
# whenever the free instance restarts, redeploys or wakes from sleep.
services:
  - type: web
    name: saanjh-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Saanjh
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Render's load balancer terminates HTTPS.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: FORCE_HTTPS
        value: "true"
      # Tighten to your Vercel URL once it exists, e.g. https://ecommerce-frontend.vercel.app
      # ("*" is safe here: the API uses Bearer tokens, not cookies).
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
